name: E2E Tests

on:
  repository_dispatch:
    types: [platform-deploy]
  workflow_dispatch:
  push:
    branches: [main]
  # Pull requests only get the checks and the signer build; the live E2E is skipped.
  pull_request:

# The managed wallet job holds the staging signing key, so the token can only read the repo.
permissions:
  contents: read

# Live runs share the same wallets, so they queue instead of overlapping.
# Pull requests get their own group so they never displace a queued live run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.ref || 'e2e-live' }}
  cancel-in-progress: false
  # Keeps every waiting run; by default a new run replaces the one waiting.
  queue: max

# A failed job saves its reason as an artifact, not a job output: GitHub drops any
# output that contains a secret's value, and some secrets here are plain words.
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      # An explicit bash shell turns on pipefail, so a step still fails through tee.
      - name: Typecheck
        shell: bash
        run: bunx tsc --noEmit 2>&1 | tee -a e2e.log
      - name: Unit tests
        shell: bash
        run: bun test 2>&1 | tee -a e2e.log
      - name: Save the failure reason
        if: failure() && github.event_name != 'pull_request'
        run: mkdir -p failure-reason && .github/scripts/failure-reason.sh e2e.log > failure-reason/checks.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure() && github.event_name != 'pull_request'
        with:
          name: failure-reason-checks
          path: failure-reason/
          retention-days: 1

  circle:
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - name: Run Circle payout E2E
        # Covers the ledger compliance wait, which can take up to 35 min when
        # Circle is slow to accept. A typical run takes about 3 min.
        timeout-minutes: 50
        shell: bash
        run: bun run index.ts 2>&1 | tee e2e.log
        env:
          TESSER_CLIENT_ID: ${{ secrets.STAGING_TESSER_CLIENT_ID }}
          TESSER_CLIENT_SECRET: ${{ secrets.STAGING_TESSER_CLIENT_SECRET }}
          TESSER_BASE_URL: ${{ secrets.STAGING_TESSER_BASE_URL }}
          TESSER_AUTH_URL: ${{ secrets.STAGING_TESSER_AUTH_URL }}
          # Unset means STELLAR
          PAYMENT_NETWORK: ${{ vars.PAYMENT_NETWORK }}
          BENEFICIARY_WALLET_ADDRESS: ${{ secrets.BENEFICIARY_WALLET_ADDRESS }}
          ENABLE_VARIANTS: ${{ secrets.ENABLE_VARIANTS }}
          DEBUG_MODE: ${{ secrets.DEBUG_MODE }}
          CIRCLE_API_KEY: ${{ secrets.CIRCLE_API_KEY }}
      # Redacts every sensitive secret this job uses; ENABLE_VARIANTS and DEBUG_MODE are plain settings.
      - name: Save the failure reason
        if: failure()
        run: >-
          mkdir -p failure-reason && .github/scripts/failure-reason.sh e2e.log
          TESSER_CLIENT_ID TESSER_CLIENT_SECRET TESSER_BASE_URL TESSER_AUTH_URL CIRCLE_API_KEY BENEFICIARY_WALLET_ADDRESS
          > failure-reason/circle.txt
        env:
          TESSER_CLIENT_ID: ${{ secrets.STAGING_TESSER_CLIENT_ID }}
          TESSER_CLIENT_SECRET: ${{ secrets.STAGING_TESSER_CLIENT_SECRET }}
          TESSER_BASE_URL: ${{ secrets.STAGING_TESSER_BASE_URL }}
          TESSER_AUTH_URL: ${{ secrets.STAGING_TESSER_AUTH_URL }}
          CIRCLE_API_KEY: ${{ secrets.CIRCLE_API_KEY }}
          BENEFICIARY_WALLET_ADDRESS: ${{ secrets.BENEFICIARY_WALLET_ADDRESS }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: failure-reason-circle
          path: failure-reason/
          retention-days: 1

  managed-wallet:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # Pull requests run the committed gradle-wrapper.jar, so check it is Gradle's.
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build and test the Kotlin signer
        working-directory: signers/kotlin
        shell: bash
        run: |
          ./gradlew --no-daemon --quiet test installDist 2>&1 | tee -a ../../e2e.log
          sdk_jars=(build/install/tesser-signer/lib/sdk-[0-9]*.jar)
          echo "Signing with the latest Kotlin SDK: ${sdk_jars[*]##*/}"
      - name: Unit tests that run the Kotlin signer
        shell: bash
        # Each test starts a JVM, which can outlast bun's 5 s default on a busy runner.
        run: bun test --timeout 30000 src/setup/kotlin-signer.test.ts 2>&1 | tee -a e2e.log
        env:
          REQUIRE_KOTLIN_SIGNER: "1"
      - name: Run managed wallet E2E
        if: github.event_name != 'pull_request'
        # Above the tests' 2 + 2 × 12 + 2 × 11 + 12 min and the payout and rebalance files' 14 min setups, so a slow run still prints its failure.
        timeout-minutes: 90
        shell: bash
        run: bun run e2e 2>&1 | tee -a e2e.log
        env:
          TESSER_CLIENT_ID: ${{ secrets.STAGING_TESSER_CLIENT_ID }}
          TESSER_CLIENT_SECRET: ${{ secrets.STAGING_TESSER_CLIENT_SECRET }}
          TESSER_BASE_URL: ${{ secrets.STAGING_TESSER_BASE_URL }}
          TESSER_AUTH_URL: ${{ secrets.STAGING_TESSER_AUTH_URL }}
          SIGNING_PUBLIC_KEY: ${{ secrets.STAGING_SIGNING_PUBLIC_KEY }}
          SIGNING_PRIVATE_KEY: ${{ secrets.STAGING_SIGNING_PRIVATE_KEY }}
          SIGNING_ENCLAVE_ID: ${{ secrets.STAGING_SIGNING_ENCLAVE_ID }}
      - name: Save the failure reason
        if: failure() && github.event_name != 'pull_request'
        run: >-
          mkdir -p failure-reason && .github/scripts/failure-reason.sh e2e.log
          TESSER_CLIENT_ID TESSER_CLIENT_SECRET TESSER_BASE_URL TESSER_AUTH_URL
          SIGNING_PUBLIC_KEY SIGNING_PRIVATE_KEY SIGNING_ENCLAVE_ID
          > failure-reason/managed-wallet.txt
        env:
          TESSER_CLIENT_ID: ${{ secrets.STAGING_TESSER_CLIENT_ID }}
          TESSER_CLIENT_SECRET: ${{ secrets.STAGING_TESSER_CLIENT_SECRET }}
          TESSER_BASE_URL: ${{ secrets.STAGING_TESSER_BASE_URL }}
          TESSER_AUTH_URL: ${{ secrets.STAGING_TESSER_AUTH_URL }}
          SIGNING_PUBLIC_KEY: ${{ secrets.STAGING_SIGNING_PUBLIC_KEY }}
          SIGNING_PRIVATE_KEY: ${{ secrets.STAGING_SIGNING_PRIVATE_KEY }}
          SIGNING_ENCLAVE_ID: ${{ secrets.STAGING_SIGNING_ENCLAVE_ID }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure() && github.event_name != 'pull_request'
        with:
          name: failure-reason-managed-wallet
          path: failure-reason/
          retention-days: 1

  # The OpenFX ledger's own flows: they send nothing on-chain, so they run beside the managed wallet job.
  openfx:
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - name: Run OpenFX ledger E2E
        # Above the swap's 18 min and the withdrawal's 38 min, so a slow run still prints its failure.
        timeout-minutes: 60
        shell: bash
        run: bun run e2e:openfx 2>&1 | tee e2e.log
        env:
          TESSER_CLIENT_ID: ${{ secrets.STAGING_TESSER_CLIENT_ID }}
          TESSER_CLIENT_SECRET: ${{ secrets.STAGING_TESSER_CLIENT_SECRET }}
          TESSER_BASE_URL: ${{ secrets.STAGING_TESSER_BASE_URL }}
          TESSER_AUTH_URL: ${{ secrets.STAGING_TESSER_AUTH_URL }}
          OPENFX_LEDGER_ID: ${{ secrets.STAGING_OPENFX_LEDGER_ID }}
          OPENFX_BANK_ID: ${{ secrets.STAGING_OPENFX_BANK_ID }}
      - name: Save the failure reason
        if: failure()
        run: >-
          mkdir -p failure-reason && .github/scripts/failure-reason.sh e2e.log
          TESSER_CLIENT_ID TESSER_CLIENT_SECRET TESSER_BASE_URL TESSER_AUTH_URL OPENFX_LEDGER_ID OPENFX_BANK_ID
          > failure-reason/openfx.txt
        env:
          TESSER_CLIENT_ID: ${{ secrets.STAGING_TESSER_CLIENT_ID }}
          TESSER_CLIENT_SECRET: ${{ secrets.STAGING_TESSER_CLIENT_SECRET }}
          TESSER_BASE_URL: ${{ secrets.STAGING_TESSER_BASE_URL }}
          TESSER_AUTH_URL: ${{ secrets.STAGING_TESSER_AUTH_URL }}
          OPENFX_LEDGER_ID: ${{ secrets.STAGING_OPENFX_LEDGER_ID }}
          OPENFX_BANK_ID: ${{ secrets.STAGING_OPENFX_BANK_ID }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: failure-reason-openfx
          path: failure-reason/
          retention-days: 1

  report:
    needs: [checks, circle, managed-wallet, openfx]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        # A job can fail before saving its reason; the message then says so.
        continue-on-error: true
        with:
          pattern: failure-reason-*
          merge-multiple: true
          path: failure-reasons
      - name: Build the Slack message
        id: message
        run: .github/scripts/slack-failure-payload.sh >> "$GITHUB_OUTPUT"
        env:
          REASONS_DIR: failure-reasons
          REPOSITORY: ${{ github.repository }}
          TRIGGER: ${{ github.event_name }}
          COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          CIRCLE_RESULT: ${{ needs.circle.result }}
          MANAGED_WALLET_RESULT: ${{ needs.managed-wallet.result }}
          OPENFX_RESULT: ${{ needs.openfx.result }}
      - name: Notify Slack
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: ${{ steps.message.outputs.payload }}
